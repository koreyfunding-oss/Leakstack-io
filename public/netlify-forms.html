<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LeakStack.io — Form Definitions</title>
  </head>
  <body>
    <!--
      Static form definitions for Netlify Forms detection. This is an SPA:
      the visible email modals submit via fetch, but Netlify only registers a
      form if a matching <form data-netlify="true"> exists in the deployed
      files. These static definitions provide that match. They are never
      linked from the site UI.
    -->
    <form name="leak-detector" method="POST" data-netlify="true">
      <input type="email" name="email" />
      <input type="text" name="tool" />
          <button type="submit">Submit</button>
    </form>
    <form name="mortgage" method="POST" data-netlify="true">
      <input type="email" name="email" />
      <input type="text" name="tool" />
          <button type="submit">Submit</button>
    </form>
    <form name="credit-damage" method="POST" data-netlify="true">
      <input type="email" name="email" />
      <input type="text" name="tool" />
          <button type="submit">Submit</button>
    </form>
    <form name="excuse-generator" method="POST" data-netlify="true">
      <input type="email" name="email" />
      <input type="text" name="tool" />
          <button type="submit">Submit</button>
    </form>
    <form name="audit-request" method="POST" data-netlify="true">
      <input type="email" name="email" />
      <input type="text" name="tool" />
      <input type="text" name="monthly_leak" />
      <input type="text" name="annual_leak" />
      <input type="text" name="severity" />
      <textarea name="problems"></textarea>
      <button type="submit">Submit</button>
    </form>
    <form name="contact" method="POST" data-netlify="true">
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
          <button type="submit">Submit</button>
    </form>
  </body>
</html>
